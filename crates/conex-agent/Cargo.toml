[package]
name = "conex-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "conex private-side agent: outbound reverse connection, restricted workspace and upstream credentials"
publish = false

[[bin]]
name = "conex-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
base64 = "0.22"
ring = "0.17"
conex-access.workspace = true
prost.workspace = true
conex-core.workspace = true
conex-proto.workspace = true
conex-provider-fs.workspace = true
conex-source.workspace = true
conex-sdk.workspace = true
conex-agent-domain = { path = "../conex-agent-domain" }
# P10 llm 模块的上游 HTTP 客户端（OpenAI 兼容面）；与 host 同版本同特性。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex.workspace = true
futures = "0.3"
http = "1"
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "io-std", "sync", "process", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml.workspace = true
webpki-roots.workspace = true
[dev-dependencies]
tempfile.workspace = true
