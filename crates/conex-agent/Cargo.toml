[package]
name = "conex-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "conex private-side agent: outbound reverse connection, restricted workspace and upstream credentials"
[[bin]]
name = "conex-agent"
path = "src/main.rs"

[dependencies]
prost.workspace = true
conex-core = { path = "../conex-core" }
conex-proto = { path = "../conex-proto" }
conex-provider-fs = { path = "../conex-provider-fs" }
conex-source = { path = "../conex-source" }
futures = "0.3"
http = "1"
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml.workspace = true
webpki-roots.workspace = true
[dev-dependencies]
tempfile.workspace = true
