[package]
name = "conex-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embeddable symmetric conex S1 JSON WebSocket SDK"

[dependencies]
conex-proto.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
# wss 连接需要进程级 CryptoProvider；rustls 在本工作区同时启用了 ring 与
# aws-lc-rs，无法自动选择，必须显式安装（见 client.rs connect 处）。
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[dev-dependencies]
conex-host.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
