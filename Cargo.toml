[workspace]
resolver = "3"
members = ["crates/conex-proto", "xtask"]

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
cid = "0.11"
multihash = "0.19"
sha2 = "0.11"
