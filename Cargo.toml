[workspace]
resolver = "3"
members = [
    "crates/conex-proto",
    "crates/conex-core",
    "crates/conex-source",
    "crates/conex-provider-fs",
    "crates/conex-transport-http",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
pbjson = "0.9"
pbjson-build = "0.9"
pbjson-types = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
cid = "0.11"
multihash = "0.19"
sha2 = "0.11"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
secrecy = "0.10"
cap-std = "3"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = "0.14"
tokio = { version = "1", default-features = false, features = ["time", "macros", "rt", "rt-multi-thread", "net", "io-util", "sync"] }
