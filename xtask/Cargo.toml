[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Repository automation for conex: code generation, conformance, e2e, gates and benchmarks"
publish = false

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
anyhow = "1"
base64 = "0.22"
conex-access = { path = "../crates/conex-access" }
conex-proto = { path = "../crates/conex-proto" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
ring = "0.17"
tokio-tungstenite = "0.30"
futures = "0.3"
hex = "0.4"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio.workspace = true
walkdir = "2"
