# Production Compose for Dokploy.
#
# Dokploy imports this as a Compose service: create a new project in the
# UI, pick "Compose", point Dokploy at this file and the repo's
# Dockerfile. The variables below are read from deployment/.env (which
# Dokploy replaces with its own secret store at deploy time).
#
# Volumes are declared under `volumes:` so Dokploy provisions named
# persistent storage on first deploy. Replace the host-mounted
# config/toml paths with Dokploy's "File Mount" entries pointing at
# the secrets / configs you upload through the UI.

services:
  host:
    build:
      context: ..
      dockerfile: Dockerfile
    image: conex:local
    command: ["/etc/conex/host.toml"]
    # Dokploy fronts this port with its own reverse proxy; the in-app
    # listener only needs to be reachable inside the container network.
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # `${VAR:?msg}` syntax makes compose fail loudly when a required
      # variable is unset; Dokploy replaces these via the UI's
      # Environment panel.
      - ${CONEX_HOST_CONFIG:?set CONEX_HOST_CONFIG to the host.toml path on the host}:/etc/conex/host.toml:ro
      - ${CONEX_CA_PEM:?set CONEX_CA_PEM to the ca.pem path on the host}:/etc/conex/ca.pem:ro
      - conex-content:/var/lib/conex/content
      - conex-session:/var/lib/conex/session
      - conex-operation:/var/lib/conex/operation
    secrets:
      - agent_a_token
      - agent_b_token
    restart: unless-stopped
    healthcheck:
      # The landing page returns 200 even with an empty guest session;
      # this is a TCP-level probe, not a strict readiness gate.
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8787/ >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  agent-a:
    image: conex:local
    entrypoint: ["/usr/local/bin/conex-agent"]
    command: ["--config", "/etc/conex/agent.toml"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${CONEX_AGENT_A_CONFIG:?set CONEX_AGENT_A_CONFIG}:/etc/conex/agent.toml:ro
      - ${CONEX_CA_PEM:?set CONEX_CA_PEM}:/etc/conex/ca.pem:ro
      # `agent.toml` mounts `/srv/agent-a` as the source-remote root.
      # Provision the directory on the host (or a Dokploy volume) and
      # drop the files you want visitors to read.
      - ${CONEX_AGENT_A_DATA:?set CONEX_AGENT_A_DATA}:/srv/agent-a:ro
    secrets:
      - agent_a_token
    restart: unless-stopped
    depends_on:
      host:
        condition: service_healthy

  agent-b:
    image: conex:local
    entrypoint: ["/usr/local/bin/conex-agent"]
    command: ["--config", "/etc/conex/agent.toml"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${CONEX_AGENT_B_CONFIG:?set CONEX_AGENT_B_CONFIG}:/etc/conex/agent.toml:ro
      - ${CONEX_CA_PEM:?set CONEX_CA_PEM}:/etc/conex/ca.pem:ro
      - ${CONEX_AGENT_B_DATA:?set CONEX_AGENT_B_DATA}:/srv/agent-b:ro
    secrets:
      - agent_b_token
    restart: unless-stopped
    depends_on:
      host:
        condition: service_healthy

volumes:
  conex-content:
  conex-session:
  conex-operation:

secrets:
  agent_a_token:
    file: ${CONEX_AGENT_A_TOKEN_FILE:?set CONEX_AGENT_A_TOKEN_FILE}
  agent_b_token:
    file: ${CONEX_AGENT_B_TOKEN_FILE:?set CONEX_AGENT_B_TOKEN_FILE}