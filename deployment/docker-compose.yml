# Private hub deployment for Dokploy (MVP-P5/P7 shape).
#
# The image bakes the private `docker/host.toml`: bootstrap-code login, no
# guest entry. Two operator inputs are required before the container can
# start (fail-fast by design) and are documented in
# docs/runbooks/private-mvp.md:
#   - CONEX_HUB_SIGNING_KEY env var (base64 pkcs8 DER of the grant key)
#   - a persistent volume for /var/lib/conex (private store + P1 roots)

services:
  host:
    build:
      context: ..
      dockerfile: Dockerfile
    image: conex:landing
    # Dokploy fronts this port with its own TLS-terminating reverse proxy; the
    # in-app listener stays plaintext inside the container network, which
    # docker/host.toml acknowledges with `allow_plaintext_bind`.
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - conex-data:/var/lib/conex
    environment:
      # Set in the Dokploy secret manager; the container exits without it.
      - CONEX_HUB_SIGNING_KEY
    restart: unless-stopped
    healthcheck:
      # The login page is static; this is a liveness probe, not an auth gate.
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8787/ >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  conex-data:
