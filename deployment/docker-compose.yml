# Public landing deployment for Dokploy.
#
# One container, guest-only, no secrets: the image bakes `docker/host.toml`
# and a synthetic demo tree, so a fresh clone deploys without any file
# mounts or environment variables.
#
# For a real multi-host deployment (reverse-connected agents, per-principal
# tokens, TLS pinning) use the full stack in the repository history and
# deployment/host.toml.example; that one needs Secrets + File Mounts and is
# documented in docs/runbooks/dokploy.md.

services:
  host:
    build:
      context: ..
      dockerfile: Dockerfile
    image: conex:landing
    # Dokploy fronts this port with its own TLS-terminating reverse proxy; the
    # in-app listener stays plaintext inside the container network, which
    # docker/host.toml acknowledges with `allow_plaintext_bind`.
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - conex-content:/var/lib/conex/content
      - conex-session:/var/lib/conex/session
      - conex-operation:/var/lib/conex/operation
    restart: unless-stopped
    healthcheck:
      # The landing page returns 200 for anonymous visitors, so this is a
      # liveness probe rather than a strict readiness gate.
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8787/ >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  conex-content:
  conex-session:
  conex-operation:
