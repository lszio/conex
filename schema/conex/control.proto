syntax = "proto3";

package conex;

import "conex/common.proto";

message HelloRequest {
  string profile_id = 1;
  Plane plane = 2;
  repeated string provides = 3;
  repeated string requires = 4;
}

message RejectedCapability {
  string method = 1;
  string direction = 2;
  string reason = 3;
}

message HelloResponse {
  string binding_id = 1;
  uint32 expires_in_ms = 2;
  string profile_id = 3;
  Plane plane = 4;
  repeated string provides = 5;
  repeated RejectedCapability rejected_capabilities = 6;
  Limits limits = 7;
}

// Identity and capability summary for a negotiated WS link. These fields are
// deliberately separate from HTTP binding state.
message LinkIdentity {
  string link_id = 1;
  string peer_id = 2;
  string tenant_id = 3;
}

message NegotiatedCapabilities {
  repeated string provides = 1;
  repeated string requires = 2;
  repeated RejectedCapability rejected_capabilities = 3;
}

// WSS ready exchange uses the same generated control types as hello.
message ReadyRequest {
  string negotiation_id = 1;
  string profile_id = 2;
  Plane plane = 3;
  repeated string provides = 4;
  Limits limits = 5;
}

message ReadyResponse {
  string negotiation_id = 1;
  string profile_id = 2;
  Plane plane = 3;
  repeated string provides = 4;
  Limits limits = 5;
  LinkIdentity link_identity = 6;
}
