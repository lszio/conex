syntax = "proto3";

package conex.v1;

import "conex/v1/common.proto";

message HelloRequest {
  string profile_id = 1;
  Plane plane = 2;
  repeated string provides = 3;
  repeated string requires = 4;
}

message RejectedCapability {
  string method = 1;
  string direction = 2;
  string reason = 3;
}

message HelloResponse {
  string binding_id = 1;
  uint32 expires_in_ms = 2;
  string profile_id = 3;
  Plane plane = 4;
  repeated string provides = 5;
  repeated RejectedCapability rejected_capabilities = 6;
  Limits limits = 7;
}
