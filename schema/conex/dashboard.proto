syntax = "proto3";

package conex;

// Connection panel messages (L10). Real-time view of every browser link and
// every reverse-connected agent link on the host. Only ui role callers can
// inspect the UI link rows; service/agent roles are rejected at the broker.
message ConnectionListRequest {}

message UiLinkSummary {
  string link_id = 1;
  string principal_id = 2;
  string tenant_id = 3;
  uint64 connected_at_ms = 4;
  uint64 last_seen_at_ms = 5;
  uint64 tickets_issued = 6;
  uint64 calls_total = 7;
  uint64 calls_in_flight = 8;
}

message AgentLinkSummary {
  string agent_id = 1;
  string principal_id = 2;
  string tenant_id = 3;
  uint64 generation = 4;
  uint64 registered_at_ms = 5;
  uint64 last_heartbeat_at_ms = 6;
  repeated string endpoint_ids = 7;
}

message ConnectionListResponse {
  repeated UiLinkSummary browser_links = 1;
  repeated AgentLinkSummary agent_links = 2;
}

// Client panel messages. A "client" is a browser visitor: one UI link with a
// self-declared name, group and visibility. Callers may only see clients that
// have `visible` set; hidden clients are not listed to anyone, not even to
// themselves as rows (their own row is still addressable by linkId).
message ClientListRequest {}

message ClientProfile {
  // Self-declared, session-scoped. Never authenticated, never reused as an
  // identity: two clients may pick the same name.
  string display_name = 1;
  // Optional free-form bucket the visitor can use to sort their own view.
  string group = 2;
  // When false the client disappears from every other client's list.
  bool visible = 3;
}

message ClientSummary {
  string link_id = 1;
  string principal_id = 2;
  string tenant_id = 3;
  ClientProfile profile = 4;
  uint64 connected_at_ms = 5;
  uint64 last_seen_at_ms = 6;
  // Self-reported by the client's own page; never trusted for access.
  string user_agent = 7;
}

message ClientListResponse {
  repeated ClientSummary clients = 1;
}

message ClientProfileRequest {
  ClientProfile profile = 1;
}

message ClientProfileResponse {
  ClientSummary self = 1;
}

// Sends a greeting to one online client. The host pushes
// `conex/client-hello` to the target link; the target replies with
// `conex/client-pong`, which the host reports back to the sender together
// with the measured round-trip time. An offline or hidden target fails with
// `unavailable` rather than being silently dropped.
message ClientHelloRequest {
  string target_link_id = 1;
  string text = 2;
}

message ClientHelloResult {
  string target_link_id = 1;
  // Round-trip milliseconds measured by the host, from handing the frame to
  // the target's socket until its pong is read back.
  uint64 round_trip_ms = 2;
  string reply = 3;
}