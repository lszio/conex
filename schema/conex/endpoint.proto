syntax = "proto3";

package conex;

// Configured attachment kind. A configured endpoint is not necessarily online.
enum AttachmentKind {
  ATTACHMENT_KIND_UNSPECIFIED = 0;
  ATTACHMENT_KIND_EMBEDDED = 1;
  ATTACHMENT_KIND_OUTBOUND_HTTP = 2;
  ATTACHMENT_KIND_REVERSE_AGENT = 3;
}

// Runtime connection state projected into the endpoint catalog.
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_NOT_APPLICABLE = 1;
  CONNECTION_STATE_OFFLINE = 2;
  CONNECTION_STATE_READY = 3;
}

message AuthorizedScope {
  string method = 1;
  string root = 2;
  bool subtree = 3;
}

message EndpointSummary {
  string endpoint_id = 1;
  string display_name = 2;
  string provider_id = 3;
  AttachmentKind attachment_kind = 4;
  optional string agent_id = 5;
  optional string region = 6;
  ConnectionState connection_state = 7;
  repeated string available_methods = 8;
  repeated AuthorizedScope authorized_scopes = 9;
}

message EndpointListRequest {
  optional uint32 limit = 1;
  optional string after_endpoint_id = 2;
}

message EndpointListResult {
  repeated EndpointSummary endpoints = 1;
  optional string next_after_endpoint_id = 2;
}
