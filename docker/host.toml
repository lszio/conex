[private]
issuer = "conex://conex.lszio.space"
kid = "hub-2026q4"
# Base64 (pkcs8 DER) via secret manager env; see docs/runbooks/private-mvp.md.
signing_key_backend = "env64:CONEX_HUB_SIGNING_KEY"
tenant = "private"
store_path = "/var/lib/conex/private.sqlite"
principal = "owner"
admin_principals = ["owner"]
node_principals = ["home-node"]
