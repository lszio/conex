output_schema = "conex.AgentSnapshotResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "events/read"
input_schema = "conex.AgentEventReadInput"
output_schema = "conex.AgentEventReadResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/conversations/create"
input_schema = "conex.AgentConversationCreateInput"
output_schema = "conex.AgentConversationCreateResult"
action = "agent.create"
execution = "non_replayable"
[[capabilities.contracts.methods]]
