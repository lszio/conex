# Private product hub (MVP-P5/P7) — single-user, bootstrap-code entry.
#
# This replaces the guest landing shape: there is no [web_guest] here (the two
# are mutually exclusive at config load), so the served page is the private
# workbench behind a one-time bootstrap code login.
#
# Secrets never live in this file:
#   - the grant signing key arrives via the CONEX_HUB_SIGNING_KEY environment
#     variable (base64 of the raw pkcs8 DER; see docs/runbooks/private-mvp.md).
#     Without it the host refuses to start, by design.
#   - the node publication token exists here only as its sha256; the raw value
#     lives in the operator's node configuration (~/.conex/home-node).

listen = "0.0.0.0:8787"
allow_plaintext_bind = true

audience = "conex.lszio.space"
host_origin = "conex://conex.lszio.space"
web_origin = "https://conex.lszio.space"
web_root = "/opt/conex/web"

web_origins = [
  "https://preview-conex.lszio.space",
]

content_root = "/var/lib/conex/content"
session_root = "/var/lib/conex/session"
operation_root = "/var/lib/conex/operation"

# Node publication credential: sha256 of the raw token; the principal is the
# node publication identity and must appear in [private].node_principals.
[[tokens]]
token_hash = "2ece673b2a111cb2eb2683b7d811980dcbc212c5f2e06ecd97926d9ac04cd8c7"
principal_id = "home-node"
tenant_id = "private"
audience = "conex.lszio.space"
role = "service"

# S1 static approval: the node publishes nothing to the relay plane (all
# private modules are direct-only), but S1 capability negotiation must be
# configured for the publication link to negotiate module/register.
[[capabilities.contracts]]
contract_id = "conex.agent"
[[capabilities.contracts.methods]]
name = "agent/endpoints/list"
input_schema = "conex.AgentEndpointListInput"
output_schema = "conex.AgentEndpointListResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/workspaces/list"
input_schema = "conex.AgentWorkspaceListInput"
output_schema = "conex.AgentWorkspaceListResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/conversations/list"
input_schema = "conex.AgentConversationListInput"
output_schema = "conex.AgentConversationListResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/conversations/get"
input_schema = "conex.AgentConversationGetInput"
output_schema = "conex.AgentConversationGetResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/conversations/history"
input_schema = "conex.AgentConversationHistoryInput"
output_schema = "conex.AgentConversationHistoryResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/messages/read"
input_schema = "conex.AgentMessageReadInput"
output_schema = "conex.AgentMessageReadResult"
action = "agent.read"
execution = "read_only"
[[capabilities.contracts.methods]]
name = "agent/executions/get"
