# Release pipeline: tag `v*` → full gate → artifacts → GitHub Release →
# optional registry publishing.
#
# Registry publishing runs only when the matching secret exists:
#   - CRATES_TOKEN: a crates.io API token → publishes every workspace crate
#     in dependency order (crates.io then serves the .crate files).
#   - NPM_TOKEN: an npmjs.com automation token → publishes @conex/sdk
#     (scoped packages need the `conex` npm org to exist and --access public).
# Without the secrets the GitHub Release still carries every artifact:
# the SDK tarball installs with `npm install ./conex-sdk-0.1.0.tgz`, and the
# Rust crates install from source with
# `cargo install --git https://github.com/lszio/conex conex-host`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_TOKEN != '' }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Gate (fmt, clippy, tests, conformance, e2e, generate check)
        run: cargo xtask check

      - name: Build host binaries
        run: cargo build --release -p conex-host -p conex-agent

      - name: Build web bundle
        run: bun run build:web

      - name: Build SDK package
        run: |
          cd sdk/typescript
          bun run build
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Collect bundle artifacts
        run: |
          tar czf dist/conex-host-linux-amd64.tar.gz -C target/release conex-host conex-agent
          tar czf dist/conex-web-dist.tar.gz -C web dist
          ls -la dist/

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      # Dependency order: cargo resolves each crate's workspace deps against
      # crates.io, so a crate can only package/publish after its deps landed.
      # Already-published versions are skipped, which makes the step
      # resumable: crates.io rate-limits bursts of NEW crates (429), so a
      # failed run is retried by re-pushing the tag and the loop continues
      # where it stopped. The .crate files themselves are served by crates.io
      # and are not attached to the release.
      - name: Publish crates to crates.io
        if: env.HAS_CRATES_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          crates="conex-proto conex-core conex-source conex-provider-fs \
                  conex-transport-http conex-content \
                  conex-provider-http-catalog conex-assembly \
                  conex-agent conex-host"
          published() {
            curl -fsS --max-time 30 \
              -H "User-Agent: conex-release (repo lszio/conex)" \
              "https://crates.io/api/v1/crates/$1" 2>/dev/null |
              jq -e '.crate.max_version == "0.1.0"' >/dev/null 2>&1
          }
          for attempt in 1 2 3 4 5 6; do
            failed=0
            for p in $crates; do
              if published "$p"; then continue; fi
              cargo publish -p "$p" --no-verify || failed=1
            done
            [ "$failed" = 0 ] && exit 0
            echo "some crates failed (attempt $attempt); backing off 120s"
            sleep 120
          done
          exit 1

      - name: Publish SDK to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish sdk/typescript --access public
